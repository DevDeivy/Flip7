spring.application.name=game

# Default local runtime uses in-memory H2 so bootRun starts cleanly without file locks or external Postgres schema.
spring.datasource.url=jdbc:h2:mem:flip7db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

ollama.base-url=http://localhost:11434
ollama.model=flip7-ai:latest
ollama.timeout-ms=120000
game.ai-turn-delay-ms=1200